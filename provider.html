<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift It · Healthcare Provider</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system;background:#f8faf9;color:#19362b}header{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #d9e5df}a{color:#356f58;font-weight:800}main{max-width:760px;margin:auto;padding:28px 18px}h1{font-size:32px}nav{display:flex;gap:18px;overflow:auto;border-bottom:1px solid #d9e5df;padding-bottom:14px}section{padding:22px 0;border-bottom:1px solid #d9e5df}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input,select,textarea{width:100%;min-height:46px;border:1px solid #ccdcd4;border-radius:8px;padding:10px;background:#fff}button{margin-top:16px;background:#17382c;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:800}.note{color:#687b72;line-height:1.5}.ok{display:none;color:#1f6f54;font-weight:800;margin-top:12px}.ok.show{display:block}</style></head><body><header><a href="index.html">Shift It</a><a href="index.html">Switch portal</a></header><main><h1>Healthcare Provider</h1><nav><a href="#home">Home</a><a href="#post">Post shift</a><a href="#bookings">Bookings</a></nav><section id="home"><h2>Healthcare Provider workspace</h2><p class="note">For GP &amp; Primary Care, Hospitals, Community &amp; District Nursing, PCNs and community teams.</p></section><section id="post"><h2>Post a shift</h2><form><label>Provider type</label><select><option>GP Surgery</option><option>Hospital</option><option>Community / District Nursing</option><option>Primary Care Network</option><option>Community Trust / Team</option><option>Other</option></select><label>Role</label><input required><label>Date</label><input type="date" required><label>Hourly rate</label><input type="number" required><label>Community/base location</label><input><label>Geographical patch</label><input><label>Mileage/travel arrangements</label><textarea></textarea><label>Vehicle required</label><select><option>No</option><option>Yes</option></select><label>Required competencies</label><textarea></textarea><button>Save test shift</button><div class="ok">✓ Shift saved in this test session.</div></form></section><section id="bookings"><h2>Bookings</h2><p class="note">No test bookings yet.</p></section></main><script>document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;f.querySelector('.ok')?.classList.add('show')}));</script></body></html>
